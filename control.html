<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Viewer - Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: #a0a0a0;
            font-size: 1rem;
        }

        .block-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .block-item {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .block-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(233, 69, 96, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .block-item.selected {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }

        .block-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .block-preview {
            color: #a0a0a0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .status {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .status.connected {
            color: #4ade80;
        }

        .instructions {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            color: #e94560;
            font-size: 0.85rem;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .nav-button {
            background: rgba(233, 69, 96, 0.2);
            border: 2px solid #e94560;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            background: rgba(233, 69, 96, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .nav-button:disabled:hover {
            background: rgba(233, 69, 96, 0.2);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Song Viewer Control</h1>
        <p class="subtitle">Select a block to display on the view page</p>
        
        <div class="block-list" id="blockList"></div>
        
        <div class="status" id="status">Ready to broadcast</div>
        
        <div class="navigation">
            <button class="nav-button" id="prevButton" disabled>
                ← Previous
            </button>
            <button class="nav-button" id="nextButton">
                Next →
            </button>
        </div>
        
        <div class="instructions">
            <strong>Tip:</strong> Open /view in a separate browser window or tab to see the presentation. Use arrow keys to navigate.
        </div>
    </div>

    <script>
        // Amazing Grace lyrics
        const songBlocks = [
            {
                id: "verse1",
                title: "Verse 1",
                lines: [
                    "Amazing grace (how sweet the sound)",
                    "that saved a wretch like me!",
                    "I once was lost, but now am found,",
                    "was blind, but now I see."
                ]
            },
            {
                id: "verse2",
                title: "Verse 2",
                lines: [
                    "'Twas grace that taught my heart to fear,",
                    "and grace my fears relieved;",
                    "how precious did that grace appear",
                    "the hour I first believed!"
                ]
            },
            {
                id: "verse3",
                title: "Verse 3",
                lines: [
                    "Through many dangers, toils and snares",
                    "I have already come:",
                    "'tis grace has brought me safe thus far,",
                    "and grace will lead me home."
                ]
            },
            {
                id: "verse4",
                title: "Verse 4",
                lines: [
                    "The Lord has promised good to me,",
                    "his word my hope secures;",
                    "he will my shield and portion be",
                    "as long as life endures."
                ]
            },
            {
                id: "verse5",
                title: "Verse 5",
                lines: [
                    "Yes, when this flesh and heart shall fail,",
                    "and mortal life shall cease:",
                    "I shall possess, within the veil,",
                    "a life of joy and peace."
                ]
            },
            {
                id: "verse6",
                title: "Verse 6",
                lines: [
                    "The earth shall soon dissolve like snow,",
                    "the sun forbear to shine;",
                    "but God, who called me here below,",
                    "will be forever mine."
                ]
            }
        ];

        // Initialize BroadcastChannel
        const channel = new BroadcastChannel('song-viewer');
        let selectedBlockId = null;

        // Render block list
        function renderBlockList() {
            const blockList = document.getElementById('blockList');
            blockList.innerHTML = '';

            songBlocks.forEach(block => {
                const blockItem = document.createElement('div');
                blockItem.className = 'block-item';
                blockItem.dataset.blockId = block.id;
                
                blockItem.innerHTML = `
                    <div class="block-title">${block.title}</div>
                    <div class="block-preview">${block.lines.join(' • ')}</div>
                `;

                blockItem.addEventListener('click', () => selectBlock(block.id));
                blockList.appendChild(blockItem);
            });
        }

        // Select and broadcast a block
        function selectBlock(blockId) {
            selectedBlockId = blockId;
            
            // Update UI
            document.querySelectorAll('.block-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.blockId === blockId);
            });

            // Update navigation buttons
            updateNavigationButtons();

            // Broadcast to view page
            const message = {
                type: 'SELECT_BLOCK',
                blockId: blockId
            };
            
            channel.postMessage(message);
            
            // Update status
            const status = document.getElementById('status');
            const block = songBlocks.find(b => b.id === blockId);
            status.textContent = `Broadcasting: ${block.title}`;
            status.classList.add('connected');
            
            setTimeout(() => {
                status.classList.remove('connected');
            }, 1000);
        }

        // Update navigation button states
        function updateNavigationButtons() {
            const currentIndex = songBlocks.findIndex(b => b.id === selectedBlockId);
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.disabled = currentIndex <= 0;
            nextButton.disabled = currentIndex >= songBlocks.length - 1;
        }

        // Navigate to previous block
        function navigatePrevious() {
            const currentIndex = songBlocks.findIndex(b => b.id === selectedBlockId);
            if (currentIndex > 0) {
                selectBlock(songBlocks[currentIndex - 1].id);
            }
        }

        // Navigate to next block
        function navigateNext() {
            const currentIndex = songBlocks.findIndex(b => b.id === selectedBlockId);
            if (currentIndex < songBlocks.length - 1) {
                selectBlock(songBlocks[currentIndex + 1].id);
            }
        }

        // Initialize
        renderBlockList();
        
        // Setup navigation buttons
        document.getElementById('prevButton').addEventListener('click', navigatePrevious);
        document.getElementById('nextButton').addEventListener('click', navigateNext);
        
        // Keyboard navigation
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                navigatePrevious();
            } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                navigateNext();
            }
        });
    </script>
</body>
</html>
