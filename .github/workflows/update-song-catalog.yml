name: Update Static Song Catalog

on:
  workflow_dispatch:
  repository_dispatch:
    types: [supabase_song_update]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  export-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export active songs from Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export:songs

      - name: Commit catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/exports/
          if git diff --cached --quiet; then
            echo "Song catalog is unchanged."
          else
            git commit -m "chore: update static song catalog"
            git push
          fi